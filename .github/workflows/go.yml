name: Build and Test
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
permissions:
  contents: read

jobs:
  build:
    name: Go CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # Read the toolchain from go.mod rather than a hand-maintained matrix.
          go-version-file: 'go.mod'
          cache: true
      # Require the current exccd dependency set rather than stale 2023
      # pseudo-versions.
      - name: Verify current exccd dependency pins
        run: |
          if grep -R -n --include=go.mod -E 'github.com/EXCCoin/exccd.*-2023' .; then
            echo "::error::a go.mod still pins EXCCoin/exccd at a 2023 pseudo-version."
            echo "Update the exccd module pins before testing."
            exit 1
          fi

      - name: Build and test all modules
        run: sh ./run_tests.sh

  platforms:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            goamd64: v1
            exe: ''
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            goarm64: v8.0
            exe: ''
          - runner: windows-2025
            goos: windows
            goarch: amd64
            goamd64: v1
            exe: .exe
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            goarm64: v8.0
            exe: .exe
          - runner: macos-26-intel
            goos: darwin
            goarch: amd64
            goamd64: v1
            exe: ''
          - runner: macos-26
            goos: darwin
            goarch: arm64
            goarm64: v8.0
            exe: ''
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build and start exccwallet
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM64: ${{ matrix.goarm64 }}
          GOWORK: 'off'
        run: |
          set -eux
          mkdir -p dist
          go build -buildvcs=false -trimpath -o "dist/exccwallet${{ matrix.exe }}" .
          "./dist/exccwallet${{ matrix.exe }}" --version
