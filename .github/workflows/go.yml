name: Build and Test
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
permissions:
  contents: read

jobs:
  build:
    name: Go CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # Read the toolchain from go.mod rather than a hand-maintained matrix.
          go-version-file: 'go.mod'
          cache: true
      # Require the current exccd dependency set rather than stale 2023
      # pseudo-versions.
      - name: Verify current exccd dependency pins
        run: |
          if grep -R -n --include=go.mod -E 'github.com/EXCCoin/exccd.*-2023' .; then
            echo "::error::a go.mod still pins EXCCoin/exccd at a 2023 pseudo-version."
            echo "Update the exccd module pins before testing."
            exit 1
          fi

      - name: Build and test all modules
        run: sh ./run_tests.sh

  platforms:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            goamd64: v1
            cc: gcc
            cxx: g++
            exe: ''
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            goarm64: v8.0
            cc: gcc
            cxx: g++
            exe: ''
          - runner: windows-2025
            goos: windows
            goarch: amd64
            goamd64: v1
            cc: gcc
            cxx: g++
            exe: .exe
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            goarm64: v8.0
            cc: aarch64-w64-mingw32-gcc
            cxx: aarch64-w64-mingw32-g++
            exe: .exe
          - runner: macos-26-intel
            goos: darwin
            goarch: amd64
            goamd64: v1
            cc: clang
            cxx: clang++
            exe: ''
          - runner: macos-26
            goos: darwin
            goarch: arm64
            goarm64: v8.0
            cc: clang
            cxx: clang++
            exe: ''
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Set up LLVM-MinGW for Windows ARM64
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $root = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-aarch64.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne '312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba') {
            throw "LLVM-MinGW checksum mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $root
          $toolchain = (Get-ChildItem -Path $root -Directory -Filter 'llvm-mingw-*').FullName
          "$toolchain\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and verify exccwallet
        shell: bash
        env:
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM64: ${{ matrix.goarm64 }}
          GOWORK: 'off'
        run: |
          set -eux
          mkdir -p dist
          go build -buildvcs=false -trimpath -o "dist/exccwallet${{ matrix.exe }}" .
          "./dist/exccwallet${{ matrix.exe }}" --version
