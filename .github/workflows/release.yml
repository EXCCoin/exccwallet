name: Release

# Build release artifacts from tagged commits and verify exccd dependency pins
# before publishing.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Verify current exccd dependency pins
        run: |
          if grep -R -n --include=go.mod -E 'github.com/EXCCoin/exccd.*-2023' .; then
            echo "::error::a go.mod still pins EXCCoin/exccd at a 2023 pseudo-version."
            echo "Update the exccd module pins before publishing."
            exit 1
          fi
          if [ -f go.work ]; then
            echo "::error::go.work is present in the release checkout."
            echo "Release builds must resolve dependencies from go.mod alone so"
            echo "third parties can reproduce them."
            exit 1
          fi

      - name: Test all modules from go.mod
        env:
          GOWORK: 'off'
        run: sh ./run_tests.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            goamd64: v1
            cc: gcc
            cxx: g++
            extension: tar.gz
            exe: ''
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            goarm64: v8.0
            cc: gcc
            cxx: g++
            extension: tar.gz
            exe: ''
          - runner: windows-2025
            goos: windows
            goarch: amd64
            goamd64: v1
            cc: gcc
            cxx: g++
            extension: zip
            exe: .exe
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            goarm64: v8.0
            cc: aarch64-w64-mingw32-gcc
            cxx: aarch64-w64-mingw32-g++
            extension: zip
            exe: .exe
          - runner: macos-26-intel
            goos: darwin
            goarch: amd64
            goamd64: v1
            cc: clang
            cxx: clang++
            extension: tar.gz
            exe: ''
          - runner: macos-26
            goos: darwin
            goarch: arm64
            goarm64: v8.0
            cc: clang
            cxx: clang++
            extension: tar.gz
            exe: ''

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Set up LLVM-MinGW for Windows ARM64
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $root = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-aarch64.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne '312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba') {
            throw "LLVM-MinGW checksum mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $root
          $toolchain = (Get-ChildItem -Path $root -Directory -Filter 'llvm-mingw-*').FullName
          "$toolchain\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        shell: bash
        env:
          # The wallet links exccd/cequihash through standalone.
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM64: ${{ matrix.goarm64 }}
          GOWORK: 'off'
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_NAME="exccwallet-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          BINARY="dist/${ASSET_NAME}/exccwallet${{ matrix.exe }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"
          echo "BINARY=${BINARY}" >> "$GITHUB_ENV"
          mkdir -p "dist/${ASSET_NAME}"
          # Major/Minor/Patch are consts in version/version.go and cannot be
          # set by ldflags.  The following step enforces source/tag agreement.
          LDFLAGS="-s -w \
            -X github.com/EXCCoin/exccwallet/v2/version.PreRelease= \
            -X github.com/EXCCoin/exccwallet/v2/version.BuildMetadata=release"
          if [ "${GOOS}" = windows ]; then
            LDFLAGS="${LDFLAGS} -linkmode=external -extldflags=-static"
          fi
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" \
            -o "${BINARY}" .

      - name: Verify version/version.go matches the tag
        shell: bash
        run: |
          set -eu
          reported=$("${BINARY}" --version | head -1)
          echo "reported: ${reported}"
          case "${reported}" in
            *"${VERSION}"*) ;;
            *) echo "::error::binary reports '${reported}', tag is '${VERSION}' -- bump Major/Minor/Patch in version/version.go"; exit 1 ;;
          esac

      - name: Refuse dynamic compiler runtimes
        if: matrix.goos == 'windows'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          OBJDUMP=objdump
          if [ "${GOARCH}" = arm64 ]; then
            OBJDUMP=llvm-objdump
          fi
          IMPORTS=$("${OBJDUMP}" -p "${BINARY}" | sed -n 's/.*DLL Name: //p')
          printf '%s\n' "${IMPORTS}"
          if printf '%s\n' "${IMPORTS}" | grep -Eiq \
            '^(libgcc|libstdc\+\+|libwinpthread|libc\+\+|libunwind).*\.dll$'; then
            echo '::error::Windows binary depends on a compiler runtime DLL.'
            exit 1
          fi

      - name: Add build information
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          cp LICENSE "dist/${ASSET_NAME}/"
          {
            echo "Tag: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Target: ${GOOS}/${GOARCH}"
            echo "Go: $(go version)"
            echo "CC: ${CC}"
            echo "CXX: ${CXX}"
            echo
            go version -m "${BINARY}"
          } > "dist/${ASSET_NAME}/BUILDINFO.txt"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "dist/${ASSET_NAME}.tar.gz" "${ASSET_NAME}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: bash
        working-directory: dist
        run: 7z a "${ASSET_NAME}.zip" "${ASSET_NAME}"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exccwallet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ env.ASSET_NAME }}.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and manifest
        working-directory: dist
        run: |
          set -eu
          sha256sum exccwallet-* > SHA256SUMS
          cat > MANIFEST.md <<EOF
          # exccwallet ${GITHUB_REF_NAME}

          | | |
          |---|---|
          | Tag | \`${GITHUB_REF_NAME}\` |
          | Commit | \`${GITHUB_SHA}\` |
          | Built by | \`${GITHUB_REPOSITORY}\` run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |
          | Targets | Linux, Windows, and macOS on amd64 and arm64 |

          Every binary was built with CGO enabled and executed with
          \`--version\` on its target operating system and architecture.
          Each archive includes its license and embedded Go module build info.

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`
          EOF
          if [ "${GITHUB_REF_NAME}" = v2.8.1 ]; then
            cat >> MANIFEST.md <<'CORRECTION'

          ## Corrected v2.8.1 release

          These archives replace the original v2.8.1 binaries published from
          commit `0169433fa6856c9b8aeb3d04b0a34b06cb1f317c`. The tag and semantic
          version intentionally remain v2.8.1. The corrected source clears
          ticket purchase passphrases, binds VSP policies per request, and
          restores unmined spend filters after restart.

          Moving the lightweight `v2.8.1` tag changes GitHub's generated source
          archives to the corrected commit. The original archive hashes are
          retained below for provenance.

          ## Original artifact set

          | | |
          |---|---|
          | Commit | `0169433fa6856c9b8aeb3d04b0a34b06cb1f317c` |
          | Built by | `EXCCoin/exccwallet` run [30840945047](https://github.com/EXCCoin/exccwallet/actions/runs/30840945047) |

          Original archive checksums:

          ```
          45e9f1a02c1da06d129b117c0681e6f60a7c9fb1abdaea6c37bcf7360a68a9a1  exccwallet-v2.8.1-darwin-amd64.tar.gz
          c4af209e8523313edf0d40fdd119005c03ac862f93631697069a48fc80103241  exccwallet-v2.8.1-darwin-arm64.tar.gz
          758ee4654c64854b3806f21815c9f4db7e0dab2d10165f19e6ca7275bf051e63  exccwallet-v2.8.1-linux-amd64.tar.gz
          58c7b170153486d5dfad280d59cbdc955b8412dc509ef28e54d5832f9dfad755  exccwallet-v2.8.1-linux-arm64.tar.gz
          f3afc8b22a8b90a358dd2ff2f0a834b12a33c07f14d8fdfe67a02016bbf61ccf  exccwallet-v2.8.1-windows-amd64.zip
          d78355f8664f5533f3f7e42cd3c577df2534e76553c6978d31445ef38951b838  exccwallet-v2.8.1-windows-arm64.zip
          ```
          CORRECTION
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          verify_tag_ref() {
            ref=$(gh api "repos/${GH_REPO}/git/ref/tags/${GITHUB_REF_NAME}")
            ref_type=$(jq -r '.object.type' <<< "${ref}")
            ref_sha=$(jq -r '.object.sha' <<< "${ref}")
            if [ "${ref_type}" != commit ] || [ "${ref_sha}" != "${GITHUB_SHA}" ]; then
              echo "::error::${GITHUB_REF_NAME} resolves to ${ref_type} ${ref_sha}, expected commit ${GITHUB_SHA}."
              exit 1
            fi
          }

          verify_tag_ref
          shopt -s nullglob
          archives=(dist/exccwallet-"${GITHUB_REF_NAME}"-*)
          files=("${archives[@]}" dist/SHA256SUMS dist/MANIFEST.md)
          if [ "${#archives[@]}" -ne 6 ] || [ "${#files[@]}" -ne 8 ]; then
            echo "::error::expected six archives and two metadata files, found ${#archives[@]} archives and ${#files[@]} total files."
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/MANIFEST.md \
            --draft \
            --verify-tag

          verify_tag_ref
          release=$(gh release view "${GITHUB_REF_NAME}" --json assets,isDraft,tagName)
          if [ "$(jq -r '.isDraft' <<< "${release}")" != true ]; then
            echo "::error::release was published before its assets were verified."
            exit 1
          fi
          if [ "$(jq '.assets | length' <<< "${release}")" -ne 8 ]; then
            echo "::error::draft release does not contain exactly eight assets."
            exit 1
          fi
          for file in "${files[@]}"; do
            name=${file##*/}
            expected_size=$(stat -c %s "${file}")
            expected_digest="sha256:$(sha256sum "${file}" | cut -d ' ' -f1)"
            current=$(jq -r --arg name "${name}" \
              '[.assets[] | select(.name == $name)] | if length == 1 then .[0] | [.size, .digest] | @tsv else empty end' \
              <<< "${release}")
            IFS=$'\t' read -r current_size current_digest <<< "${current}"
            if [ "${current_size}" != "${expected_size}" ] || [ "${current_digest}" != "${expected_digest}" ]; then
              echo "::error::draft ${name} is missing or does not match the build."
              exit 1
            fi
          done

          verify_tag_ref
          gh release edit "${GITHUB_REF_NAME}" --draft=false --verify-tag
          verify_tag_ref
          release=$(gh release view "${GITHUB_REF_NAME}" --json isDraft)
          if [ "$(jq -r '.isDraft' <<< "${release}")" != false ]; then
            echo "::error::verified release is still a draft."
            exit 1
          fi
