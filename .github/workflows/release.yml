name: Release

# Build release artifacts from tagged commits and verify exccd dependency pins
# before publishing.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Verify current exccd dependency pins
        run: |
          if grep -R -n --include=go.mod -E 'github.com/EXCCoin/exccd.*-2023' .; then
            echo "::error::a go.mod still pins EXCCoin/exccd at a 2023 pseudo-version."
            echo "Update the exccd module pins before publishing."
            exit 1
          fi
          if [ -f go.work ]; then
            echo "::error::go.work is present in the release checkout."
            echo "Release builds must resolve dependencies from go.mod alone so"
            echo "third parties can reproduce them."
            exit 1
          fi

      - name: Test all modules from go.mod
        env:
          GOWORK: 'off'
        run: sh ./run_tests.sh

      - name: Build
        env:
          # The wallet links exccd/cequihash through standalone.
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
          GOWORK: 'off'
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist
          # Major/Minor/Patch are consts in version/version.go and CANNOT be set
          # by ldflags -- only PreRelease and BuildMetadata are vars.  A version
          # bump is therefore a source edit; the check below enforces that the
          # source and the tag agree.
          go build -buildvcs=false -trimpath \
            -ldflags "-s -w \
              -X github.com/EXCCoin/exccwallet/v2/version.PreRelease= \
              -X github.com/EXCCoin/exccwallet/v2/version.BuildMetadata=release" \
            -o dist/exccwallet .

      - name: Verify version/version.go matches the tag
        run: |
          set -eu
          reported=$(./dist/exccwallet --version | head -1)
          echo "reported: ${reported}"
          case "${reported}" in
            *"${VERSION}"*) ;;
            *) echo "::error::binary reports '${reported}', tag is '${VERSION}' -- bump Major/Minor/Patch in version/version.go"; exit 1 ;;
          esac

      - name: Generate checksums and manifest
        working-directory: dist
        run: |
          set -eu
          sha256sum exccwallet > SHA256SUMS
          cat > MANIFEST.md <<EOF
          # exccwallet ${GITHUB_REF_NAME}

          | | |
          |---|---|
          | Tag | \`${GITHUB_REF_NAME}\` |
          | Commit | \`${GITHUB_SHA}\` |
          | Built by | \`${GITHUB_REPOSITORY}\` run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |
          | Go | \`$(go version | cut -d' ' -f3)\` |
          | Target | linux/amd64, CGO enabled, GOAMD64=v1, GOWORK=off |

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`

          exccd module versions linked into this build:

          \`\`\`
          $(go version -m exccwallet | grep 'EXCCoin/exccd' || echo 'none')
          \`\`\`
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/MANIFEST.md \
            --verify-tag \
            dist/exccwallet dist/SHA256SUMS dist/MANIFEST.md
